spring.application.name=proytic2026r

# Base PostgreSQL compartida: Neon / IATU SA / production / neondb.
# Cada integrante debe configurar DB_PASSWORD en las variables de entorno
# de su equipo o en IntelliJ: Run > Edit Configurations > Environment variables.
# Obtener la clave en Neon > Connect (no guardarla en Git ni en este archivo).
# Todos deben usar esta misma base y rama para compartir tablas y registros.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-aged-leaf-b4obql2g-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Conserva el comportamiento de desarrollo existente: crear/actualizar el esquema.
# Coordinar cambios de entidades entre integrantes; nunca usar create/create-drop
# con esta base compartida. Para desactivar cambios automáticos: DB_DDL_AUTO=none.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
