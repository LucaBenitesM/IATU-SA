spring.application.name=proytic2026r
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/proytic2026r}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always

# Mercado Pago. Sin Access Token el sistema usa el simulador interno (/mock-mercadopago).
# Las credenciales reales NO van aca: se ponen en application-local.properties (no se sube a git)
# o en las variables de entorno MP_ACCESS_TOKEN y MP_PUBLIC_KEY.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
mercadopago.base-url=https://api.mercadopago.com
spring.config.import=optional:file:./application-local.properties
